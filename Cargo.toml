[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/protocol",
    "crates/host_server",
    "crates/agent_server",
    "crates/tool_rag",
    "crates/utility",
    "apps/bento_desktop/src-tauri"
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
license-file = "LICENSE"
readme = "README.md"
authors = ["TokiraNeo <TokiraNeo@outlook.com>"]
description = "A tool search engine for AI Agents."
repository = "https://github.com/TokiraNeo/Bento"
